version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - docker.env
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/mlartifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlartifacts

volumes:
  mlflow_data:
